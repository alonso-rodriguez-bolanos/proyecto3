<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <style>
      .caja{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .n1{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .n2{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
      .n3{fill:#fefce8;stroke:#eab308;stroke-width:2}
      .lim{fill:#fef2f2;stroke:#ef4444;stroke-width:2;stroke-dasharray:6 4}
      .t{font-weight:600;fill:#0f172a}
      .s{fill:#475569;font-size:12.5px}
      .et{font-weight:700;font-size:13px}
      .l{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#f)}
      .ld{stroke:#ef4444;stroke-width:1.3;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>

  <!-- Entrada -->
  <rect class="caja" x="30" y="20" width="250" height="60" rx="10"/>
  <text class="t" x="155" y="45" text-anchor="middle">GitHub Actions (cron 12 h)</text>
  <text class="s" x="155" y="65" text-anchor="middle">python ejecutar.py</text>

  <rect class="caja" x="355" y="20" width="250" height="60" rx="10"/>
  <text class="t" x="480" y="45" text-anchor="middle">leer_repo()</text>
  <text class="s" x="480" y="65" text-anchor="middle">Supabase · respaldo: repo_cache.json</text>
  <path class="l" d="M280 50H351"/>

  <rect class="caja" x="680" y="20" width="250" height="60" rx="10"/>
  <text class="t" x="805" y="45" text-anchor="middle">REPO: 215 juegos activos</text>
  <text class="s" x="805" y="65" text-anchor="middle">tabla juegos (PostgreSQL)</text>
  <path class="l" d="M680 50H609"/>

  <path class="l" d="M480 80V118"/>

  <!-- Nivel 1 -->
  <rect class="n1" x="30" y="122" width="900" height="400" rx="14"/>
  <text class="et" x="50" y="146" fill="#1d4ed8">NIVEL 1 · procesos · ProcessPoolExecutor(spawn), N = 1…16 · un juego por tarea</text>

  <!-- Proceso 1 -->
  <rect class="caja" x="50" y="160" width="560" height="345" rx="12"/>
  <text class="t" x="66" y="183">Proceso 1 · procesar_juego(juego)</text>

  <!-- Nivel 2 -->
  <rect class="n2" x="66" y="196" width="528" height="292" rx="12"/>
  <text class="et" x="82" y="219" fill="#15803d">NIVEL 2 · 3 hilos · fuentes del juego</text>

  <rect class="caja" x="82" y="232" width="300" height="240" rx="10"/>
  <text class="t" x="98" y="254">Hilo: procesar_tiendas()</text>

  <!-- Nivel 3 -->
  <rect class="n3" x="96" y="266" width="272" height="190" rx="10"/>
  <text class="et" x="110" y="288" fill="#a16207">NIVEL 3 · 2 hilos · tiendas</text>
  <rect class="caja" x="110" y="302" width="244" height="58" rx="8"/>
  <text class="t" x="232" y="326" text-anchor="middle">Hilo: Steam</text>
  <text class="s" x="232" y="345" text-anchor="middle">precio actual, regular, formato</text>
  <rect class="caja" x="110" y="376" width="244" height="58" rx="8"/>
  <text class="t" x="232" y="400" text-anchor="middle">Hilo: PlayStation Store</text>
  <text class="s" x="232" y="419" text-anchor="middle">precio, prueba gratis, plataforma</text>

  <rect class="caja" x="398" y="232" width="180" height="110" rx="10"/>
  <text class="t" x="488" y="268" text-anchor="middle">Hilo: Metacritic</text>
  <text class="s" x="488" y="290" text-anchor="middle">score (JSON-LD)</text>

  <rect class="caja" x="398" y="362" width="180" height="110" rx="10"/>
  <text class="t" x="488" y="398" text-anchor="middle">Hilo: HLTB</text>
  <text class="s" x="488" y="420" text-anchor="middle">horas main / completo</text>

  <!-- Procesos 2..N -->
  <rect class="caja" x="640" y="160" width="270" height="70" rx="12"/>
  <text class="t" x="775" y="190" text-anchor="middle">Proceso 2</text>
  <text class="s" x="775" y="210" text-anchor="middle">misma estructura (niveles 2 y 3)</text>
  <rect class="caja" x="640" y="245" width="270" height="70" rx="12"/>
  <text class="t" x="775" y="275" text-anchor="middle">Proceso 3</text>
  <text class="s" x="775" y="295" text-anchor="middle">misma estructura</text>
  <text class="t" x="775" y="340" text-anchor="middle" font-size="20">⋮</text>
  <rect class="caja" x="640" y="355" width="270" height="70" rx="12"/>
  <text class="t" x="775" y="385" text-anchor="middle">Proceso N</text>
  <text class="s" x="775" y="405" text-anchor="middle">misma estructura</text>

  <!-- Limitador -->
  <rect class="lim" x="640" y="440" width="270" height="66" rx="10"/>
  <text class="t" x="775" y="465" text-anchor="middle" fill="#b91c1c">Limitador por sitio (compartido)</text>
  <text class="s" x="775" y="486" text-anchor="middle">semáforo + candado + pausa por sitio</text>
  <path class="ld" d="M640 470H596"/>

  <!-- Salida -->
  <path class="l" d="M480 522V560"/>
  <rect class="caja" x="300" y="564" width="360" height="60" rx="10"/>
  <text class="t" x="480" y="589" text-anchor="middle">guardar_json() · escritura atómica</text>
  <text class="s" x="480" y="609" text-anchor="middle">conserva el último dato bueno · historial.json</text>

  <path class="l" d="M660 594H716"/>
  <rect class="caja" x="720" y="564" width="210" height="60" rx="10"/>
  <text class="t" x="825" y="589" text-anchor="middle">GitHub Pages</text>
  <text class="s" x="825" y="609" text-anchor="middle">web/index.html + data.json</text>

  <text class="s" x="30" y="660">Las fuentes y tiendas esperan la red en paralelo (hilos, el GIL se suelta durante la espera); los procesos reparten los juegos y la lectura del HTML entre núcleos.</text>
  <text class="s" x="30" y="680">El limitador es el mismo objeto para todos los procesos: nunca hay más de 3–4 solicitudes a la vez a un mismo sitio, sin importar N.</text>
</svg>
